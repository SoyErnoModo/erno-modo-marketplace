<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="erno-modo-marketplace — Claude Code skills marketplace by Hernán De Souza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008859"/>
      <stop offset="1" stop-color="#00633f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Faint dotted grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="40"  cy="40"  r="2"/>
    <circle cx="120" cy="40"  r="2"/>
    <circle cx="200" cy="40"  r="2"/>
    <circle cx="40"  cy="120" r="2"/>
    <circle cx="120" cy="120" r="2"/>
    <circle cx="200" cy="120" r="2"/>
    <circle cx="40"  cy="200" r="2"/>
    <circle cx="120" cy="200" r="2"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="40"  cy="280" r="2"/>
    <circle cx="120" cy="280" r="2"/>
    <circle cx="200" cy="280" r="2"/>
  </g>

  <!-- 6 plugin tiles, hexagonal-ish grid -->
  <g>
    <!-- Tile: session-recall -->
    <rect x="540" y="370" width="170" height="80" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="625" y="406" font-family="Quicksand, sans-serif" font-weight="700" font-size="16" fill="#008859" text-anchor="middle">session-recall</text>
    <text x="625" y="428" font-family="'Red Hat Display', sans-serif" font-weight="500" font-size="11" fill="#008859" opacity="0.7" text-anchor="middle">recall by topic</text>

    <!-- Tile: session-recap -->
    <rect x="720" y="370" width="170" height="80" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="805" y="406" font-family="Quicksand, sans-serif" font-weight="700" font-size="16" fill="#008859" text-anchor="middle">session-recap</text>
    <text x="805" y="428" font-family="'Red Hat Display', sans-serif" font-weight="500" font-size="11" fill="#008859" opacity="0.7" text-anchor="middle">weekly digest</text>

    <!-- Tile: topic-roadmap -->
    <rect x="900" y="370" width="170" height="80" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="985" y="406" font-family="Quicksand, sans-serif" font-weight="700" font-size="16" fill="#008859" text-anchor="middle">topic-roadmap</text>
    <text x="985" y="428" font-family="'Red Hat Display', sans-serif" font-weight="500" font-size="11" fill="#008859" opacity="0.7" text-anchor="middle">6-layer inventory</text>

    <!-- Tile: distill-lint -->
    <rect x="540" y="460" width="170" height="80" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="625" y="496" font-family="Quicksand, sans-serif" font-weight="700" font-size="16" fill="#008859" text-anchor="middle">distill-lint</text>
    <text x="625" y="518" font-family="'Red Hat Display', sans-serif" font-weight="500" font-size="11" fill="#008859" opacity="0.7" text-anchor="middle">KB audit</text>

    <!-- Tile: lectura-bionica -->
    <rect x="720" y="460" width="170" height="80" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="805" y="496" font-family="Quicksand, sans-serif" font-weight="700" font-size="16" fill="#008859" text-anchor="middle">lectura-bionica</text>
    <text x="805" y="518" font-family="'Red Hat Display', sans-serif" font-weight="500" font-size="11" fill="#008859" opacity="0.7" text-anchor="middle">WCAG 2.2 AA</text>

    <!-- Tile: modo-team-onboarding (privado, dashed border) -->
    <rect x="900" y="460" width="170" height="80" rx="14" fill="#ffffff" opacity="0.75" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="985" y="496" font-family="Quicksand, sans-serif" font-weight="700" font-size="15" fill="#008859" text-anchor="middle">modo-team-onb. 🔒</text>
    <text x="985" y="518" font-family="'Red Hat Display', sans-serif" font-weight="500" font-size="11" fill="#008859" opacity="0.7" text-anchor="middle">private</text>
  </g>

  <!-- M MODO mark top-right -->
  <g transform="translate(1120,60)">
    <rect width="100" height="100" rx="22" fill="#ffffff"/>
    <text x="50" y="76" font-family="Quicksand, sans-serif" font-weight="700" font-size="68" fill="#008859" text-anchor="middle" letter-spacing="-0.06em">M</text>
  </g>

  <!-- Title -->
  <text x="80" y="200" font-family="Quicksand, 'Red Hat Display', sans-serif" font-weight="700" font-size="80" fill="#ffffff" letter-spacing="-0.03em">erno-modo</text>
  <text x="80" y="280" font-family="Quicksand, 'Red Hat Display', sans-serif" font-weight="700" font-size="80" fill="#ffffff" letter-spacing="-0.03em">marketplace</text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="'Red Hat Display', system-ui, sans-serif" font-weight="500" font-size="28" fill="#ffffff" opacity="0.85">6 skills para que la sesión de Claude</text>
  <text x="80" y="375" font-family="'Red Hat Display', system-ui, sans-serif" font-weight="500" font-size="28" fill="#ffffff" opacity="0.75">no arranque en blanco.</text>

  <!-- Footer tag -->
  <text x="80" y="608" font-family="'Red Hat Display', system-ui, sans-serif" font-weight="600" font-size="20" fill="#ffffff" opacity="0.7">soyernomodo · marketplace para Claude Code</text>
</svg>
